{% load static %}
<style>
  .phiedu-book-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 220px;
    margin: 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 3D Book Container */
  .phiedu-book {
    position: relative;
    width: 108px;
    height: 76px;
    perspective: 800px;
    margin-bottom: 20px;
  }

  /* Hardcover Spine & Base */
  .phiedu-book-cover {
    position: absolute;
    top: 0;
    width: 52px;
    height: 76px;
    background: #1d4ed8;
    box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
  }

  .phiedu-book-cover.left {
    left: 0;
    border-radius: 5px 0 0 5px;
    transform-origin: right center;
  }

  .phiedu-book-cover.right {
    right: 0;
    border-radius: 0 5px 5px 0;
    transform-origin: left center;
  }

  /* Book Spine Center line */
  .phiedu-book-spine {
    position: absolute;
    left: 52px;
    top: -1px;
    width: 4px;
    height: 78px;
    background: #1e3a8a;
    border-radius: 2px;
    z-index: 10;
  }

  /* Static interior pages */
  .phiedu-book-base-page {
    position: absolute;
    top: 4px;
    width: 48px;
    height: 68px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    z-index: 2;
  }

  .phiedu-book-base-page.left {
    left: 3px;
    border-radius: 3px 0 0 3px;
    border-right: none;
  }

  .phiedu-book-base-page.right {
    right: 3px;
    border-radius: 0 3px 3px 0;
    border-left: none;
  }

  /* Flipping Pages */
  .phiedu-page {
    position: absolute;
    left: 54px;
    top: 4px;
    width: 48px;
    height: 68px;
    background: #ffffff;
    border: 1px solid #bfdbfe;
    border-left: none;
    border-radius: 0 3px 3px 0;
    transform-origin: 0% 50%;
    transform-style: preserve-3d;
    backface-visibility: visible;
    z-index: 5;
    animation: phieduPageFlip 1.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
  }

  .phiedu-page-1 {
    animation-delay: 0.15s;
  }

  .phiedu-page-2 {
    animation-delay: 0.45s;
  }

  .phiedu-page-3 {
    animation-delay: 0.75s;
  }

  @keyframes phieduPageFlip {
    0% {
      transform: rotateY(0deg);
      opacity: 1;
      background: #ffffff;
    }
    45% {
      opacity: 1;
      background: #f1f5f9;
    }
    90% {
      transform: rotateY(-180deg);
      opacity: 0.85;
      background: #ffffff;
    }
    100% {
      transform: rotateY(-180deg);
      opacity: 0;
    }
  }

  /* Brand Typography */
  .phiedu-loader-brand {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 4px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #1d4ed8;
    font-size: 19px;
  }

  .phiedu-dots span {
    display: inline-block;
    animation: phieduBlink 1.4s infinite both;
  }

  .phiedu-dots span:nth-child(1) { animation-delay: 0.2s; }
  .phiedu-dots span:nth-child(2) { animation-delay: 0.4s; }
  .phiedu-dots span:nth-child(3) { animation-delay: 0.6s; }

  @keyframes phieduBlink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.2); }
  }
</style>

<div class="flapping-kolibri phiedu-book-loader" role="img" aria-label="PHIEDU loading">
  <div class="phiedu-book">
    <div class="phiedu-book-cover left"></div>
    <div class="phiedu-book-base-page left"></div>
    <div class="phiedu-book-spine"></div>
    <div class="phiedu-page phiedu-page-1"></div>
    <div class="phiedu-page phiedu-page-2"></div>
    <div class="phiedu-page phiedu-page-3"></div>
    <div class="phiedu-book-base-page right"></div>
    <div class="phiedu-book-cover right"></div>
  </div>
  <div class="phiedu-loader-brand">
    <span>PHIEDU</span>
    <span class="phiedu-dots"><span>.</span><span>.</span><span>.</span></span>
  </div>
</div>
